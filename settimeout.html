<!DOCTYPE html>
<html lang="en">
//print output after 5 second

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="id"></p>
    <script>
        setTimeout(myfun, 5000)

        function myfun() {
            document.getElementById("id").innerHTML = "abc"
        }
    </script>
</body>

</html>
