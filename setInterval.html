<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="id"></p>
    <script>
        let a = 2,
            b = 5
            //repetedly print the output based on condtion
        setInterval(() => {
            document.getElementById("id").innerHTML = --a + --b;
        }, 1000)
    </script>
</body>

</html>
